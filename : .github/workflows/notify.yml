name: earthquake-notifier
 
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "テストメールを送る"
        type: boolean
        default: false
 
permissions:
  contents: write
 
concurrency:
  group: notifier
  cancel-in-progress: false
 
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Run
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_ADDR: ${{ secrets.TO_ADDR }}
        run: |
          if [ "${{ github.event.inputs.test }}" = "true" ]; then
            python jishin_notifier.py --test
          else
            python jishin_notifier.py --once
          fi
 
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
